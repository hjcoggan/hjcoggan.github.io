<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HJ Interactive</title>
<meta name="description" content="HJ Interactive makes Red Cup Arcade, a beer pong arcade game for Android.">
<style>
  :root { --bg: #f4f1ea; --card: #fffdf8; --ink: #1d1b19; --muted: #5d5750; --accent: #b3141b; --rule: #e3ddd2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161412; --card: #1f1c19; --ink: #f1ece4; --muted: #b3aba0; --accent: #ff5a5f; --rule: #34302b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 2rem; margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 24px; }
  h2 { margin: 0 0 6px; font-size: 1.3rem; }
  p { margin: 0 0 12px; color: var(--muted); }
  a { color: var(--accent); }
  footer { color: var(--muted); font-size: 0.9rem; margin-top: 24px; text-align: center; }
</style>
</head>
<body>
<main>
<h1>HJ Interactive</h1>
<div class="card">
  <h2>Red Cup Arcade</h2>
  <p>A tactile beer pong arcade game for Android: flick the ball, sink the cups, keep the streak going.</p>
  <a href="/red-cup-arcade/privacy/">Privacy policy</a>
</div>
<footer>Contact: <a href="mailto:hjcoggan@gmail.com">hjcoggan@gmail.com</a></footer>
</main>
</body>
</html>
